# ============================================================
# AI Interviewer — LLM gateway configuration (Milestone 2)
# Spec Section 8: provider chain per task, failover, quotas.
#
# Everything tunable lives here, not in code. Model names and free-tier
# limits change often — re-verify against provider docs and update the
# "verified" dates below (see docs/free-tier-facts.md).
# ============================================================

# --- Per-task provider chains (tried in order; first success wins) ---
# Tasks map to spec Section 8: parse, ats_rubric, planner, interviewer,
# approach_judge, report. `embed` serves gateway.embed(texts).
# A provider is skipped when its key is missing, when it is in cool-down,
# or when it has hit its configured daily limit.
tasks:
  parse:
    chain: [gemini, groq, openrouter]
    # Resume/JD parsing: cheap extraction, quality matters less than cost.
  ats_rubric:
    chain: [gemini, groq, openrouter]
  planner:
    chain: [gemini, groq, openrouter]
    # Planner gets the strongest models (per-task model override below).
  interviewer:
    chain: [groq, gemini, openrouter]
    # Interviewer turns are high-volume and latency-sensitive: Groq first
    # (fastest inference), Gemini as backup.
  approach_judge:
    chain: [gemini, groq, openrouter]
  report:
    chain: [gemini, groq, openrouter]
  problem_gen:
    chain: [gemini, groq, openrouter]
    # Problem authoring wants the strongest reasoning available; quality
    # matters more than latency here (offline pipeline, M6).
  research:
    chain: [gemini, groq, openrouter]
    # KB summarization (M7): one structured call per research run; quality
    # matters (planner consumes it), latency is hidden behind the 60s box.
  embed:
    chain: [gemini]
    # One hosted embedding model everywhere (spec Section 4.9).

# --- Providers ---
providers:
  gemini:
    keyEnv: GEMINI_API_KEY
    # Override for tests: GEMINI_BASE_URL (default below).
    baseUrl: "https://generativelanguage.googleapis.com"
    model: "gemini-3.8-flash"          # gemini-2.0-flash retired by Google (seen live 2026-11-04: 404 "no longer available"); 3.8-flash is Google's recommended replacement
    embeddingModel: "gemini-embedding-001"  # text-embedding-004 was retired 2026-06; verified 2026-11-03
    embeddingDimensions: 768
    supportsStreaming: true
    limits:
      requestsPerDay: 1400   # stay just under the free-tier ceiling
      tokensPerDay: 900000

  groq:
    keyEnv: GROQ_API_KEY
    baseUrl: "https://api.groq.com/openai/v1"   # OpenAI-compatible
    # 2026-08-16: Groq removed llama-3.3-70b-versatile AND llama-3.1-8b-instant
    # from free/Developer tiers (now enterprise-only; 404 model_not_found seen
    # live 2026-11-04). Groq's official replacements are the GPT-OSS family,
    # verified against Groq docs 2026-11-04. JSON mode (response_format
    # json_object) is supported via the OpenAI-compatible endpoint.
    # NOTE: there is deliberately no `fastModel` key — resolveModel() only
    # reads taskModels[task] || model, so every override is explicit below.
    model: "openai/gpt-oss-120b"          # strong model for judgement tasks
    supportsStreaming: true
    limits:
      requestsPerDay: 900                # gpt-oss-120b dev plan: 1K RPD, 200K TPD
      tokensPerDay: 90000
    taskModels:
      # High-volume, latency-sensitive interviewer turns on the fast model.
      interviewer: "openai/gpt-oss-20b"
      # Cheap extraction tasks don't need the 120b; keep them fast and cheap.
      parse: "openai/gpt-oss-20b"

  openrouter:
    keyEnv: OPENROUTER_API_KEY   # optional; chain simply skips it when absent
    baseUrl: "https://openrouter.ai/api/v1"     # OpenAI-compatible
    model: "meta-llama/llama-3.3-70b-instruct:free"
    supportsStreaming: true
    limits:
      requestsPerDay: 200   # free-model shared allowance is modest; verify
      tokensPerDay: 100000

  ollama:
    # DEV ONLY — never in the visitor's path (spec Section 0.3).
    # Used only when OLLAMA_ENABLED=true AND OLLAMA_BASE_URL is set.
    enabledEnv: OLLAMA_ENABLED
    baseUrl: "http://localhost:11434"
    model: "llama3.1:8b"
    supportsStreaming: false   # single-chunk passthrough in M2; real SSE later
    limits:
      requestsPerDay: 1000000
      tokensPerDay: 100000000

# --- Failover / resilience ---
resilience:
  requestTimeoutMs: 45000
  cooldownMs: 60000          # 503/timeout marks a provider unhealthy this long
  backoffMs: 500             # pause after a 429 before trying the next provider
  maxAttemptsPerProvider: 1  # +1 validation retry happens inside the attempt

# --- Global budget (spec Section 2: daily global budget stops new
# --- interviews gracefully before quotas run out) ---
budgets:
  maxDailyCalls: 300         # ~10 full interviews/day at ~30 calls each
  maxDailyTokens: 2000000

# --- Cache (content-hash keyed; in-memory LRU in M2, Mongo later) ---
cache:
  maxEntries: 200
  enabled: true

# --- Mock mode ---
mock:
  # Served when NO provider keys are configured at all. Deterministic, so the
  # pipeline works end-to-end with zero keys (owner decision, ADR 002).
  enabled: true
